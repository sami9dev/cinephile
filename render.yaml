services:
  # ----------------------------------------------------------------------------
  # 1. Main Next.js Full-Stack Web Application (UI + API Routes + Admin Panel)
  # ----------------------------------------------------------------------------
  - type: web
    name: cinephile-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/catalog
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: CINEFUEL_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://igacrnjjthrmvikprwmr.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
